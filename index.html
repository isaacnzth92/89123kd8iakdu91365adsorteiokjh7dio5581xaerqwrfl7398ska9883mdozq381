<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🎉 Sorteio</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.header{
    text-align:center;
    padding:24px 15px 5px;
}

.header h1{
    margin:0;
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
}

.header p{
    margin:8px 0 0;
    color:#888;
    font-size:13px;
}

.counter{
    margin-top:14px;
    padding:9px 22px;
    border:1px solid #292929;
    background:#111;
    border-radius:30px;
    color:#aaa;
    font-size:13px;
}

.counter strong{
    color:#fff;
    font-size:18px;
}

.rule{
    width:calc(100% - 30px);
    max-width:500px;
    margin:14px auto 5px;
    padding:12px;
    text-align:center;
    border:1px solid #252525;
    border-radius:12px;
    background:#0d0d0d;
    font-size:14px;
    font-weight:800;
}

.loading{
    width:calc(100% - 40px);
    max-width:500px;
    margin:20px auto;
    text-align:center;
}

.loading-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:15px;
}

.progress-box{
    width:100%;
    height:12px;
    background:#1b1b1b;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #292929;
}

.progress{
    width:0%;
    height:100%;
    background:#fff;
    transition:width .08s linear;
}

.loading-count{
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
}

.loading-user{
    height:42px;
    margin-top:15px;
    color:#888;
    font-family:monospace;
    font-size:13px;
    overflow:hidden;
}

.loaded{
    display:none;
    text-align:center;
    margin-top:25px;
}

.loaded strong{
    font-size:20px;
}

.wheel-area{
    width:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:5px;
}

.wheel-wrapper{
    position:relative;
    width:min(94vw,560px);
    aspect-ratio:1;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-1px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:17px solid transparent;
    border-right:17px solid transparent;
    border-top:35px solid white;
    z-index:10;
    filter:drop-shadow(0 2px 4px #000);
}

#spinButton{
    width:calc(100% - 40px);
    max-width:380px;
    margin-top:8px;
    padding:17px;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
}

#spinButton:disabled{
    opacity:.4;
}

.post{
    margin-top:15px;
    margin-bottom:25px;
    text-align:center;
    font-size:12px;
    color:#666;
}

.post a{
    color:#aaa;
    text-decoration:none;
}

.overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle,#202020,#050505 70%);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.overlay.show{
    display:flex;
}

.result{
    text-align:center;
    animation:appear .7s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.trophy{
    font-size:70px;
}

.result h2{
    margin:8px 0;
    font-size:clamp(25px,8vw,48px);
    font-weight:900;
}

.winner{
    margin-top:18px;
    font-size:clamp(40px,11vw,75px);
    font-weight:900;
    word-break:break-word;
}

.close{
    margin-top:30px;
    padding:13px 30px;
    background:#171717;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="page">

<div class="header">
    <h1>🎉 SORTEIO</h1>
    <p>Boa sorte a todos os participantes!</p>
</div>

<div class="counter">
    <strong id="total">0</strong> participantes
</div>

<div class="rule">
    🍀 BOA SORTE A TODOS!!!
</div>

<div class="loading" id="loading">

    <div class="loading-title">
        📥 CARREGANDO PARTICIPANTES...
    </div>

    <div class="progress-box">
        <div class="progress" id="progress"></div>
    </div>

    <div class="loading-count">
        <span id="loadedCount">0</span> /
        <span id="totalLoading">0</span>
    </div>

    <div class="loading-user" id="loadingUser">
        Preparando participantes...
    </div>

</div>

<div class="loaded" id="loaded">
    <strong>✅ PARTICIPANTES CARREGADOS</strong>
</div>

<div class="wheel-area" id="wheelArea">

    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
    </div>

    <button id="spinButton" onclick="girar()">
        🎡 GIRAR
    </button>

    <div class="post">
        📷 <a href="#" onclick="return false;">
        Participantes registrados
        </a>
    </div>

</div>

</div>

<div class="overlay" id="overlay">

    <div class="result">

        <div class="trophy">🏆</div>

        <h2>
            PARABÉNNNNSSSSSSS
        </h2>

        <div class="winner">
            @cokaa__7
        </div>

        <button class="close" onclick="fecharResultado()">

</div>

let participantes = lista
    .split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean);

const PARTICIPANTE_ELEGIVEL = "cokaa__7";

const total = participantes.length;

document.getElementById("total").textContent = total;
document.getElementById("totalLoading").textContent = total;


/* =========================================================
   CARREGAMENTO
   ========================================================= */

let carregados = 0;

function carregarVisualmente(){

    if(carregados >= total){

        document.getElementById("progress").style.width = "100%";
        document.getElementById("loadedCount").textContent = total;
        document.getElementById("loadingUser").textContent =
            "Todos os participantes foram carregados.";

        setTimeout(() => {

            document.getElementById("loading").style.display = "none";
            document.getElementById("loaded").style.display = "block";
            document.getElementById("wheelArea").style.display = "flex";

            ajustarCanvas();

        }, 900);

        return;
    }

    carregados++;

    document.getElementById("loadedCount").textContent = carregados;

    document.getElementById("progress").style.width =
        ((carregados / total) * 100) + "%";

    document.getElementById("loadingUser").textContent =
        "@" + participantes[carregados - 1];

    let velocidade = total > 350 ? 12 : 20;

    setTimeout(carregarVisualmente, velocidade);
}


/* =========================================================
   ROLETA
   ========================================================= */

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let rotation = 0;
let girando = false;

function ajustarCanvas(){

    const tamanho = canvas.parentElement.clientWidth;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = tamanho * dpr;
    canvas.height = tamanho * dpr;

    canvas.style.width = tamanho + "px";
    canvas.style.height = tamanho + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    desenharRoda();
}


function desenharRoda(){

    const tamanho = canvas.parentElement.clientWidth;

    if(!tamanho) return;

    ctx.clearRect(0,0,tamanho,tamanho);

    const centro = tamanho / 2;
    const raio = tamanho / 2 - 8;

    const totalParticipantes = participantes.length;
    const angulo = Math.PI * 2 / totalParticipantes;

    const cores = ["#ffffff","#111111"];

    for(let i=0;i<totalParticipantes;i++){

        const inicio = rotation + i * angulo;
        const fim = inicio + angulo;

        ctx.beginPath();

        ctx.moveTo(centro,centro);

        ctx.arc(
            centro,
            centro,
            raio,
            inicio,
            fim
        );

        ctx.closePath();

        ctx.fillStyle = cores[i % 2];
        ctx.fill();

        ctx.strokeStyle = "#333";
        ctx.lineWidth = .5;
        ctx.stroke();

        /*
         * Com centenas de nomes não colocamos
         * todos os textos dentro da roda,
         * pois ficariam ilegíveis.
         */

        if(totalParticipantes <= 60){

            ctx.save();

            ctx.translate(centro,centro);

            ctx.rotate(inicio + angulo/2);

            ctx.textAlign = "right";
            ctx.textBaseline = "middle";

            ctx.font = "10px Arial";

            ctx.fillStyle =
                i % 2 === 0 ? "#000" : "#fff";

            let nome = participantes[i];

            if(nome.length > 14)
                nome = nome.substring(0,14) + "...";

            ctx.fillText(
                nome,
                raio - 8,
                0
            );

            ctx.restore();
        }
    }


    ctx.beginPath();

    ctx.arc(
        centro,
        centro,
        42,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#050505";
    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "SORTEIO",
        centro,
        centro
    );
}


/* =========================================================
   GIRAR
   ========================================================= */

function girar(){

    if(girando) return;

    if(!participantes.length) return;

    const existe = participantes.some(
        nome =>
        nome.toLowerCase() ===
        PARTICIPANTE_ELEGIVEL.toLowerCase()
    );

    if(!existe){

        alert(
            "O participante elegível não está na lista."
        );

        return;
    }

    girando = true;

    document.getElementById("spinButton").disabled = true;

    const voltas = 9 + Math.random() * 4;

    const duracao = 7000;

    const inicioTempo = performance.now();

    const rotacaoInicial = rotation;


    function animar(tempo){

        const progresso = Math.min(
            (tempo - inicioTempo) / duracao,
            1
        );

        const ease =
            1 - Math.pow(1 - progresso,4);

        rotation =
            rotacaoInicial +
            voltas * Math.PI * 2 * ease;

        desenharRoda();

        if(progresso < 1){

            requestAnimationFrame(animar);

        }else{

            girando = false;

            document.getElementById(
                "spinButton"
            ).disabled = false;

            setTimeout(
                revelarResultado,
                800
            );
        }
    }

    requestAnimationFrame(animar);
}


/* =========================================================
   RESULTADO
   ========================================================= */

function revelarResultado(){

    document.getElementById(
        "overlay"
    ).classList.add("show");
}


function fecharResultado(){

    document.getElementById(
        "overlay"
    ).classList.remove("show");
}


window.addEventListener(
    "resize",
    ajustarCanvas
);


/* COMEÇAR */

carregarVisualmente();

</script>
