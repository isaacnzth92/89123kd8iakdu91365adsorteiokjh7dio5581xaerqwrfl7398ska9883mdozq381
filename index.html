<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Sorteio</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   PÁGINA
========================= */

.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   CABEÇALHO
========================= */

.header {
    width: 100%;
    text-align: center;
    padding: 22px 15px 5px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
}

.header p {
    margin: 7px 0 0;
    color: #8f8f8f;
    font-size: 14px;
}

/* =========================
   CONTADOR
========================= */

.counter {
    margin-top: 15px;

    background: #111;
    border: 1px solid #242424;

    padding: 9px 20px;

    border-radius: 30px;

    font-size: 14px;

    color: #aaa;
}

.counter strong {
    color: #fff;
    font-size: 17px;
}

/* =========================
   REGRA
========================= */

.rule {
    width: calc(100% - 30px);
    max-width: 500px;

    margin-top: 14px;

    background: #0e0e0e;

    border: 1px solid #222;

    border-radius: 12px;

    padding: 11px 15px;

    text-align: center;

    color: #999;

    font-size: 12px;

    line-height: 1.4;
}

.rule strong {
    color: #ddd;
}

/* =========================
   RODA
========================= */

.wheel-area {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    margin-top: 10px;
}

.wheel-wrapper {

    position: relative;

    width: min(94vw, 560px);

    aspect-ratio: 1;

    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   PONTEIRO
========================= */

.pointer {

    position: absolute;

    top: -1px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 35px solid #ffffff;

    z-index: 10;

    filter:
        drop-shadow(0 2px 3px rgba(0,0,0,.8));
}

/* =========================
   BOTÃO
========================= */

#spinButton {

    width: calc(100% - 40px);

    max-width: 380px;

    margin-top: 8px;

    padding: 17px 20px;

    border: none;

    border-radius: 12px;

    background: #fff;

    color: #000;

    font-size: 19px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(255,255,255,.08);

    transition: .15s;
}

#spinButton:active {
    transform: scale(.97);
}

#spinButton:disabled {
    opacity: .45;
}

/* =========================
   PARTICIPANTES
========================= */

.participants-info {

    margin-top: 15px;

    color: #666;

    font-size: 11px;

    text-align: center;
}

/* =========================
   PAINEL ADMIN
========================= */

.admin {

    width: calc(100% - 30px);

    max-width: 500px;

    margin: 25px auto;

    padding: 15px;

    background: #0d0d0d;

    border: 1px solid #222;

    border-radius: 12px;
}

.admin summary {

    color: #777;

    cursor: pointer;

    font-size: 12px;

}

.admin textarea {

    width: 100%;

    height: 180px;

    margin-top: 12px;

    resize: vertical;

    background: #050505;

    color: #fff;

    border: 1px solid #292929;

    border-radius: 8px;

    padding: 10px;

    font-family: monospace;

    font-size: 11px;

}

.load-button {

    width: 100%;

    margin-top: 8px;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #252525;

    color: white;

    font-weight: bold;

}

/* =========================
   RESULTADO
========================= */

.overlay {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            #1b1b1b 0%,
            #050505 65%
        );

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 1000;

    padding: 20px;

}

.overlay.show {
    display: flex;
}

.result {

    width: 100%;
    max-width: 500px;

    text-align: center;

    padding: 35px 20px;

    animation:
        aparecer .7s ease;
}

@keyframes aparecer {

    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.trophy {

    font-size: 55px;

    margin-bottom: 10px;
}

.result h2 {

    margin: 0;

    font-size: 20px;

    color: #999;

}

.result .winner {

    margin-top: 18px;

    font-size: clamp(
        38px,
        10vw,
        70px
    );

    font-weight: 900;

    color: white;

    word-break: break-word;

    text-shadow:
        0 0 25px rgba(255,255,255,.2);
}

.result .congratulations {

    margin-top: 18px;

    font-size: 20px;

    color: #aaa;
}

.close-button {

    margin-top: 30px;

    padding: 13px 30px;

    border: 1px solid #333;

    border-radius: 9px;

    background: #171717;

    color: #fff;

    font-weight: bold;

}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .header h1 {
        font-size: 32px;
    }

    .rule {
        font-size: 13px;
    }

    .wheel-wrapper {
        width: 600px;
    }

}

/* =========================
   CELULAR PEQUENO
========================= */

@media (max-height: 700px) {

    .header {
        padding-top: 10px;
    }

    .header h1 {
        font-size: 21px;
    }

    .counter {
        margin-top: 8px;
    }

    .rule {
        margin-top: 8px;
        padding: 7px 10px;
    }

    .wheel-area {
        margin-top: 3px;
    }

    .wheel-wrapper {
        width: 82vw;
    }

    #spinButton {
        padding: 13px;
        margin-top: 2px;
    }

}

</style>
</head>


<body>

<div class="page">

    <div class="header">

        <h1>🎉 SORTEIO</h1>

        <p>Boa sorte a todos os participantes!</p>

    </div>


    <div class="counter">

        <strong id="total">0</strong>
        participantes

    </div>


    <div class="rule">

        🎯
        <strong>
           BOA SORTE A TODOS!
        </strong>

    </div>


    <!-- RODA -->

    <div class="wheel-area">

        <div class="wheel-wrapper">

            <div class="pointer"></div>

            <canvas id="wheel"></canvas>

        </div>


        <button
            id="spinButton"
            onclick="girar()">

            🎡 GIRAR

        </button>


        <div class="participants-info">

            Todos os participantes estão registrados.

        </div>

    </div>


    <!-- ÁREA PARA CARREGAR NOMES -->

    <details class="admin">

        <summary>
            ⚙️ Gerenciar participantes
        </summary>

        <textarea
            id="namesInput"
            placeholder="Cole os participantes aqui, um por linha...">
        </textarea>

        <button
            class="load-button"
            onclick="carregarParticipantes()">

            CARREGAR PARTICIPANTES

        </button>

    </details>

</div>


<!-- RESULTADO -->

<div
    class="overlay"
    id="overlay">

    <div class="result">

        <div class="trophy">
            🏆
        </div>

        <h2>
            PARTICIPANTE ELEGÍVEL
        </h2>

        <div
            class="winner"
            id="winner">
        </div>

        <div class="congratulations">

            Parabéns! 🎉

        </div>

        <button
            class="close-button"
            onclick="fecharResultado()">

            FECHAR

        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

/*
   PARABENSSSSSSS.
*/

const PARTICIPANTE_ELEGIVEL = "cokaa__7";


/* =====================================================
   VARIÁVEIS
===================================================== */

let participantes = [];

let canvas =
    document.getElementById("wheel");

let ctx =
    canvas.getContext("2d");

let rotation = 0;

let girando = false;


/* =====================================================
   CANVAS
===================================================== */

function ajustarCanvas() {

    const tamanho =
        canvas.parentElement.clientWidth;

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        tamanho * dpr;

    canvas.height =
        tamanho * dpr;

    canvas.style.width =
        tamanho + "px";

    canvas.style.height =
        tamanho + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    desenharRoda();
}


/* =====================================================
   CARREGAR PARTICIPANTES
===================================================== */

function carregarParticipantes() {

    const texto =
        document.getElementById(
            "namesInput"
        ).value;

    participantes =
        texto
        .split(/\r?\n/)
        .map(nome => nome.trim())
        .filter(nome => nome !== "");

    /*
       Remove duplicados
    */

    participantes =
        [...new Set(participantes)];


    document.getElementById(
        "total"
    ).textContent =
        participantes.length;


    desenharRoda();

}


/* =====================================================
   DESENHAR RODA
===================================================== */

function desenharRoda() {

    const tamanho =
        canvas.parentElement.clientWidth;

    if (!tamanho) return;


    ctx.clearRect(
        0,
        0,
        tamanho,
        tamanho
    );


    const centro =
        tamanho / 2;

    const raio =
        tamanho / 2 - 8;


    /* =====================
       SEM PARTICIPANTES
    ===================== */

    if (participantes.length === 0) {

        ctx.beginPath();

        ctx.arc(
            centro,
            centro,
            raio,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#151515";

        ctx.fill();

        ctx.strokeStyle =
            "#333";

        ctx.lineWidth = 2;

        ctx.stroke();


        ctx.fillStyle =
            "#777";

        ctx.font =
            "bold 18px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "CARREGUE OS NOMES",
            centro,
            centro
        );

        return;
    }


    const total =
        participantes.length;

    const angulo =
        Math.PI * 2 / total;


    /* =====================
       CORES
    ===================== */

    const cores = [
        "#ffffff",
        "#111111"
    ];


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const inicio =
            rotation +
            i * angulo;

        const fim =
            inicio + angulo;


        ctx.beginPath();

        ctx.moveTo(
            centro,
            centro
        );

        ctx.arc(
            centro,
            centro,
            raio,
            inicio,
            fim
        );

        ctx.closePath();


        ctx.fillStyle =
            cores[i % 2];

        ctx.fill();


        ctx.strokeStyle =
            "#333";

        ctx.lineWidth =
            0.7;

        ctx.stroke();


        /*
           Se houver poucos participantes,
           mostra os nomes dentro da roda.
        */

        if (total <= 60) {

            ctx.save();

            ctx.translate(
                centro,
                centro
            );

            ctx.rotate(
                inicio +
                angulo / 2
            );

            ctx.textAlign =
                "right";

            ctx.textBaseline =
                "middle";

            ctx.font =
                "10px Arial";


            ctx.fillStyle =
                i % 2 === 0
                    ? "#000"
                    : "#fff";


            let nome =
                participantes[i];


            if (nome.length > 14) {

                nome =
                    nome.substring(
                        0,
                        14
                    ) + "...";

            }


            ctx.fillText(
                nome,
                raio - 8,
                0
            );


            ctx.restore();

        }

    }


    /* =====================
       CÍRCULO CENTRAL
    ===================== */

    ctx.beginPath();

    ctx.arc(
        centro,
        centro,
        42,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#050505";

    ctx.fill();


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "SORTEIO",
        centro,
        centro
    );

}


/* =====================================================
   GIRAR
===================================================== */

function girar() {

    if (girando)
        return;


    if (participantes.length === 0) {

        alert(
            "Carregue os participantes primeiro."
        );

        return;

    }


    /*
       Confirma que o participante elegível
       está entre os participantes.
    */

    const existe =
        participantes.some(
            nome =>
                nome.toLowerCase() ===
                PARTICIPANTE_ELEGIVEL.toLowerCase()
        );


    if (!existe) {

        alert(
            "O participante elegível não está na lista."
        );

        return;

    }


    girando = true;


    document.getElementById(
        "spinButton"
    ).disabled = true;


    /*
       Animação da roda.
    */

    const voltas =
        9 + Math.random() * 4;


    const duracao =
        7000;


    const inicioTempo =
        performance.now();


    const rotacaoInicial =
        rotation;


    function animar(tempo) {

        const progresso =
            Math.min(
                (tempo - inicioTempo) /
                duracao,
                1
            );


        /*
           Ease-out
        */

        const ease =
            1 -
            Math.pow(
                1 - progresso,
                4
            );


        rotation =
            rotacaoInicial +
            voltas *
            Math.PI *
            2 *
            ease;


        desenharRoda();


        if (progresso < 1) {

            requestAnimationFrame(
                animar
            );

        } else {

            girando = false;


            document.getElementById(
                "spinButton"
            ).disabled = false;


            setTimeout(
                revelarResultado,
                800
            );

        }

    }


    requestAnimationFrame(
        animar
    );

}


/* =====================================================
   REVELAR
===================================================== */

function revelarResultado() {

    document.getElementById(
        "winner"
    ).textContent =
        "@" +
        PARTICIPANTE_ELEGIVEL;


    document.getElementById(
        "overlay"
    ).classList.add("show");

}


/* =====================================================
   FECHAR
===================================================== */

function fecharResultado() {

    document.getElementById(
        "overlay"
    ).classList.remove("show");

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
    "resize",
    ajustarCanvas
);


ajustarCanvas();

</script>

</body>
</html>
